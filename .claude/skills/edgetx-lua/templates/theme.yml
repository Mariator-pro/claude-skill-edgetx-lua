---
# EdgeTX color theme template.
# Place this file in /THEMES/<YourThemeName>/theme.yml on the SD card. The radio
# only needs this file; logo.png + screenshot1..3.png are for the theme selector
# and the themes repo (see themes.md -> Folder structure).
# Keep the `---` first line for older EdgeTX versions. Indent with spaces, not tabs.

summary:
  name: My Theme            # shown in the EdgeTX theme selector
  author: Your Name         # shown in the UI
  info: A dark example theme # short, user-visible blurb
  # description: optional longer text (NOT read at all)
  # limits (longer is cut): name 26, author 50, info 255 chars

colors:
  # Roles follow themes.md section 4 (EdgeTX source v2.12.4, simulator-confirmed).
  # --- Text / control surface -----------------------------------------------
  PRIMARY1:   0xF8FCF8   # Label text; list item text; text on ACTIVE buttons
  PRIMARY2:   0x081828   # Control bg (buttons, fields, list items); text on bars, FOCUS, EDIT
  PRIMARY3:   0x385C68   # Inactive parts of TopBar status icons

  # --- Bars / borders / pages -------------------------------------------------
  SECONDARY1: 0x507C90   # TopBar/header bg; control text; slider & trim paths; toggle knob
  SECONDARY2: 0x507C90   # Control borders; list separators
  SECONDARY3: 0x081828   # Page, dialog, popup and keyboard bg

  # --- State highlights -----------------------------------------------------
  FOCUS:      0xA0C4D0   # Focus border of controls; fill of selected list entry; logo bg
  EDIT:       0xE8F8A8   # Field bg while editing
  ACTIVE:     0x604060   # Checked/on bg (buttons, toggles)
  WARNING:    0xE00000   # Warning text/icons; also bg of full-screen alerts and elapsed timers
  DISABLED:   0x687888   # LS monitor unused switches, stale telemetry text (not disabled controls)

  # --- Quick Menu (EdgeTX 2.12+; ignored on older firmware) ----------------
  QM_BG:      0x081828   # Quick Menu background
  QM_FG:      0xF8FCF8   # Quick Menu foreground
